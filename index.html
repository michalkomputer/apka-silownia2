<style>
/* Y2K ultrafiolet i limonka: chrome buttons, glass panels, perspective grid and a glow behind the page.
   One dark look on purpose. */
:root{
  color-scheme:dark;
  --bg:#0B0620; --surface:#1B0F5A; --surface2:#261470; --fg:#F1EBFF; --muted:#C8B8FF;
  --line:rgba(160,130,255,.28); --edge:#7A5BE0;
  --accent:#C8FF6A; --accent-fg:#10240A; --accent-soft:rgba(182,255,59,.16);
  --lime-a:#E6FFAE; --lime-b:#B6FF3B; --lime-c:#8BE000;
  --cy-a:#8FF0FF; --cy-b:#3DE0FF; --cy-c:#18B8E6;
  --pr:#2A1000; --pr-soft:#FFD9A0; --pr-fill:#FF9A2E; --danger:#FF7B8A;
  --glass:linear-gradient(180deg,rgba(90,60,200,.6) 0%,rgba(25,12,90,.9) 100%);
  --field:linear-gradient(180deg,#0A0430,#261470);
  --font-ui:'Exo 2','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --font-display:'Orbitron','Exo 2','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  background:linear-gradient(180deg,#0B0620 0%,#1E0F5C 55%,#3A1FA0 100%);
  color:var(--fg); font:15px/1.45 var(--font-ui);
  padding-block:10px 210px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 300px 280px at 0% 0%,rgba(140,100,255,.55),transparent 70%),
    linear-gradient(180deg,#0B0620 0%,#1E0F5C 55%,#3A1FA0 100%);
}
body::after{
  content:"";position:fixed;left:-40px;right:-40px;bottom:-60px;height:340px;z-index:-1;pointer-events:none;
  transform:perspective(260px) rotateX(58deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(122,91,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(122,91,255,.9) 1px,transparent 1px);
  background-size:34px 34px;opacity:.5;
}
.wrap{max-width:560px;margin:0 auto;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 14px;flex-wrap:wrap}
h1{font:800 19px/1.25 var(--font-display);margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#FFFFFF 0%,#C8FF6A 60%,#8BE000 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:800 18px/1.2 var(--font-display);margin:0}
.status{font-size:12px;color:var(--muted);background:rgba(40,20,120,.7);border:1px solid var(--edge);border-radius:999px;padding:4px 10px}
button{font-family:var(--font-ui)}
input,select{font-family:var(--font-ui)}
:focus-visible{outline:3px solid #3DE0FF;outline-offset:2px}

.seg{display:flex;gap:4px;background:rgba(15,8,60,.6);border:1px solid #6A4AD0;border-radius:999px;padding:4px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.seg button{flex:1;min-width:0;border:1px solid transparent;background:transparent;color:#D0C4FF;font:700 15px var(--font-ui);padding:10px 10px;border-radius:999px;min-height:46px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:#E8FFC0;background:linear-gradient(180deg,#E6FFAE 0%,#B6FF3B 50%,#8BE000 52%,#B2F23A 100%);color:#10240A;box-shadow:0 0 14px rgba(182,255,59,.55),inset 0 1px 0 #fff}
.seg.soft{padding:3px}
.seg.soft button[aria-pressed="true"]{border-color:#B8F8FF;background:linear-gradient(180deg,#8FF0FF 0%,#3DE0FF 50%,#18B8E6 52%,#4FE8FF 100%);color:#04204A;box-shadow:0 0 12px rgba(61,224,255,.5),inset 0 1px 0 #fff}
.seg.sm button{min-height:38px;font-size:13px;padding:6px 8px}
.seg.sm{margin-top:10px}

.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.date{margin-top:10px}
input[type="date"],.select,.fld input{width:100%;min-width:0;height:48px;border:1px solid #6A4AD0;border-radius:14px;background:var(--field);box-shadow:inset 0 2px 5px rgba(0,0,0,.5);color:var(--fg);font:700 17px var(--font-ui);padding:0 14px}

.card{background:var(--glass);border:1px solid #8A6AF0;border-radius:20px;padding:14px;margin-top:12px;box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.card h3{font:700 16px/1.25 var(--font-display);margin:0;color:var(--fg)}
.card h4{font:700 12px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pr{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(180deg,#FFD27A,#FF9A2E);color:#2A1000;font:800 12px var(--font-ui);padding:3px 10px;border:1px solid #FFE0B0;border-radius:999px;box-shadow:0 0 10px rgba(255,154,46,.5)}
.pr.sm{padding:1px 6px;margin-left:6px}
.last{font-size:13px;color:var(--muted);margin:8px 0 10px;display:flex;flex-wrap:wrap;gap:0 12px;align-items:center}
.link{background:none;border:0;color:var(--accent);font:700 13px var(--font-ui);padding:6px 0;min-height:36px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:8px 10px;align-items:center}
[hidden]{display:none!important}
.sets.nokg{grid-template-columns:28px minmax(0,1fr)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chk{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:700;color:var(--fg);min-height:44px}
.chk input{width:22px;height:22px;accent-color:#B6FF3B}
.card-head .x{margin-left:8px}
.sets .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700}
.set-n{font:800 14px var(--font-display);color:var(--accent);text-align:center}
.sets input{width:100%;min-width:0;height:50px;border:1.5px solid #6A4AD0;border-radius:14px;background:var(--field);box-shadow:inset 0 2px 5px rgba(0,0,0,.55);color:var(--fg);font:800 21px var(--font-display);text-align:center;font-variant-numeric:tabular-nums;padding:0 4px}
.sets input::placeholder{color:#8F80D0;opacity:.8;font-weight:700}
.sets input.pr-set{border-color:var(--pr-fill);box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 0 0 3px rgba(255,154,46,.35)}

.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow-head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.crow-head strong{font:700 14px var(--font-display)}
.x{width:40px;height:40px;border:1px solid #7A5BE0;background:var(--field);color:var(--muted);border-radius:50%;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pace{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted);min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid #7A5BE0;background:var(--field);color:var(--fg);border-radius:999px;padding:9px 14px;font:700 14px var(--font-ui);min-height:42px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.hint{margin:6px 0 10px;font-size:13px;color:var(--muted)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(40,20,120,.7);border:1px solid var(--edge);color:var(--accent);border-radius:14px;padding:6px 12px;margin-bottom:10px;font-weight:700}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.photo-row{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo-btn{display:inline-flex;align-items:center;position:relative}
.photo-msg{font-size:13px;color:var(--muted);min-width:0;flex:1}
.wfld{margin-top:10px;margin-bottom:12px}

.btn{background:linear-gradient(180deg,#8FF0FF 0%,#3DE0FF 50%,#18B8E6 52%,#4FE8FF 100%);color:#04204A;border:1px solid #B8F8FF;border-radius:999px;font:800 16px var(--font-ui);padding:0 24px;min-height:48px;cursor:pointer;box-shadow:0 0 16px rgba(61,224,255,.5),inset 0 1px 0 #fff}
.btn:not(.ghost):not(.danger){position:relative;overflow:hidden;isolation:isolate}
.btn:not(.ghost):not(.danger)::before{content:"";position:absolute;z-index:-1;left:8px;right:8px;top:2px;height:46%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.65),rgba(255,255,255,.08))}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.btn.sm{min-height:42px;font-size:14px;padding:0 18px}
.btn.ghost{background:var(--field);color:var(--accent);border:1px solid #7A5BE0;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.btn.danger{background:rgba(40,10,40,.5);color:var(--danger);border:1px solid var(--danger);box-shadow:none}
.btn.danger.confirm{background:#D63B50;color:#fff;border-color:#FFB0B8}

<script>
(function () {
'use strict';

/* ---------- Plan treningowy ---------- */
var PLAN = {
  klata: { label: 'Klata', slots: [
    { id: 'k1', name: 'Ciężary', variants: [{ id: 'ciezary', name: 'Ciężary' }] },
    { id: 'k2', name: 'Rozpiętki lub maszyna', variants: [{ id: 'rozpietki', name: 'Rozpiętki' }, { id: 'maszyna_klata', name: 'Klatomaszyna' }] },
    { id: 'k2b', name: 'Barki 1', variants: [{ id: 'barki1', name: 'Barki 1' }] },
    { id: 'k3', name: 'Wznosy lub deltoidy', variants: [{ id: 'wznosy', name: 'Wznosy' }, { id: 'deltoidy', name: 'Deltoidy' }] },
    { id: 'k4', name: 'Triceps', variants: [{ id: 'triceps_jg', name: 'Triceps JG', short: 'JG' }, { id: 'triceps_ciezarki', name: 'Triceps ciężarki', short: 'Ciężarki' }, { id: 'triceps_bramowy', name: 'Triceps bramowy', short: 'Bramowy' }] }
  ]},
  plecy: { label: 'Plecy', slots: [
    { id: 'p1', name: 'Lat pulldown', variants: [{ id: 'lat_pulldown', name: 'Lat pulldown' }] },
    { id: 'p2', name: 'Maszyna do pleców', variants: [{ id: 'maszyna_plecy', name: 'Maszyna do pleców' }] },
    { id: 'p3', name: 'Biceps', variants: [{ id: 'biceps', name: 'Biceps' }] },
    { id: 'p4', name: 'Brzuch', variants: [{ id: 'brzuch', name: 'Brzuch', noKg: true }] }
  ]}
};
var CARDIO = [
  { id: 'bieganie', name: 'Bieganie' }, { id: 'rowerek', name: 'Rowerek' },
  { id: 'rowerowiatrak', name: 'Rowerowiatrak' }, { id: 'kardiomaszyna', name: 'Kardiomaszyna' }
];
var SETS = 3;
var EXNAME = {}, EXGROUP = {}, ORDER = [], CNAME = {}, NOKG = {};
Object.keys(PLAN).forEach(function (t) {
  PLAN[t].slots.forEach(function (s) {
    s.variants.forEach(function (v) { EXNAME[v.id] = v.name; EXGROUP[v.id] = t; ORDER.push(v.id); if (v.noKg) NOKG[v.id] = 1; });
  });
});
CARDIO.forEach(function (c) { CNAME[c.id] = c.name; });

/* ---------- Pomocnicze ---------- */
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var num = function (s) {
  if (s === undefined || s === null || s === '') return NaN;
  var v = parseFloat(String(s).replace(',', '.'));
  return isFinite(v) ? v : NaN;
};
var fmt = function (n, d) { d = d === undefined ? 1 : d; var p = Math.pow(10, d); return String(Math.round(n * p) / p).replace('.', ','); };
var fmtInt = function (n) { return Math.round(n).toLocaleString('pl-PL'); };
var pad = function (n) { return String(n).padStart(2, '0'); };
var fmtPace = function (m) { var s = Math.round(m * 60); return Math.floor(s / 60) + ':' + pad(s % 60); };
var plural = function (n, one, few, many) {
  if (n === 1) return one;
  var a = n % 10, b = n % 100;
  return (a >= 2 && a <= 4 && !(b >= 12 && b <= 14)) ? few : many;
};
var todayStr = function () { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var parseD = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
var DF_DAY = new Intl.DateTimeFormat('pl-PL', { weekday: 'short', day: 'numeric', month: 'short' });
var DF_DAYY = new Intl.DateTimeFormat('pl-PL', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
var DF_SHORT = new Intl.DateTimeFormat('pl-PL', { day: 'numeric', month: 'short' });
var DF_SHORTY = new Intl.DateTimeFormat('pl-PL', { day: 'numeric', month: 'short', year: 'numeric' });
var thisYear = new Date().getFullYear();
var fDay = function (s) { return DF_DAY.format(parseD(s)); };
var fDayY = function (s) { var d = parseD(s); return (d.getFullYear() === thisYear ? DF_DAY : DF_DAYY).format(d); };
var fShortY = function (s) { var d = parseD(s); return (d.getFullYear() === thisYear ? DF_SHORT : DF_SHORTY).format(d); };
var lsGet = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
var lsSet = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- Stan ---------- */
var sessions = [];
var store = null;
var tab = 'trening';
var pendingDelete = null, pendingTimer = null;
var chartSel = { ex: null, metric: null, idx: null };
var STANDALONE = !(window.claude && window.claude.use);
var dlApi = null, photoApi = null, photoMsgs = {};
var settings = { weight: 0 };

/* Szacunek kalorii dla biegania: kcal = MET x waga (kg) x czas (h); MET z tabeli wg prędkości (km/h) */
var RUN_MET = [[4, 3.0], [5.6, 4.3], [6.4, 6.0], [8, 8.3], [8.4, 9.0], [9.7, 9.8], [10.8, 10.5], [11.3, 11.0], [12.1, 11.5], [12.9, 11.8], [13.8, 12.3], [14.5, 12.8], [16.1, 14.5], [17.5, 16.0], [19.3, 19.0]];
function runKcal(min, km, w) {
  w = w === undefined ? settings.weight : w;
  if (!(min > 0 && km > 0 && w > 0)) return 0;
  var sp = km / (min / 60), met = RUN_MET[RUN_MET.length - 1][1];
  if (sp <= RUN_MET[0][0]) met = RUN_MET[0][1];
  else for (var i = 1; i < RUN_MET.length; i++) {
    if (sp <= RUN_MET[i][0]) { var a = RUN_MET[i - 1], b = RUN_MET[i]; met = a[1] + (b[1] - a[1]) * (sp - a[0]) / (b[0] - a[0]); break; }
  }
  return Math.round(met * w * (min / 60));
}

function slugName(n) {
  var t = String(n).toLowerCase();
  try { t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}
  t = t.replace(/ł/g, 'l').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);
  return 'c_' + (t || 'cwiczenie');
}
function syncNames() {
  sessions.forEach(function (s) {
    var nm = s && s.names; if (!nm || typeof nm !== 'object') return;
    Object.keys(nm).forEach(function (id) {
      if (!EXNAME[id] && typeof nm[id] === 'string') { EXNAME[id] = nm[id].slice(0, 60); EXGROUP[id] = 'custom'; ORDER.push(id); }
    });
  });
}
function groupLabel(g) { return g === 'custom' ? 'Inne' : PLAN[g].label; }
function emptySet() { return { kg: '', reps: '', dkg: '', dreps: '', dopen: false }; }
function emptySets() { var a = []; for (var i = 0; i < SETS; i++) a.push(emptySet()); return a; }
function fnum(n) { return n > 0 ? String(n).replace('.', ',') : ''; }
function docSetToDraft(x) {
  var dr = x && x.drop;
  return { kg: fnum(x.kg), reps: fnum(x.reps), dkg: dr ? fnum(dr.kg) : '', dreps: dr ? fnum(dr.reps) : '', dopen: !!dr };
}
function newDraft(type) { return { date: todayStr(), type: type || 'klata', ex: {}, variant: {}, cardio: [], custom: [], editId: null }; }
function cleanDraft(d) {
  if (!(d && typeof d === 'object' && PLAN[d.type] && typeof d.date === 'string' && d.ex && typeof d.ex === 'object' && d.variant && Array.isArray(d.cardio))) return newDraft();
  try {
    var q = function (z) { return z == null ? '' : String(z); };
    d.custom = Array.isArray(d.custom) ? d.custom.filter(function (c) { return c && typeof c.id === 'string' && typeof c.name === 'string'; })
      .map(function (c) { return { id: c.id, name: c.name.slice(0, 60), noKg: !!c.noKg }; }) : [];
    Object.keys(d.ex).forEach(function (k) {
      var v = d.ex[k];
      if (!Array.isArray(v)) { delete d.ex[k]; return; }
      var fixed = [], n = Math.max(SETS, Math.min(v.length, 8));
      for (var i = 0; i < n; i++) { var o = v[i] || {}; fixed.push({ kg: q(o.kg), reps: q(o.reps), dkg: q(o.dkg), dreps: q(o.dreps), dopen: !!(o.dopen || o.dkg || o.dreps) }); }
      d.ex[k] = fixed;
    });
    d.cardio = d.cardio.filter(function (c) { return c && typeof c === 'object' && CNAME[c.kind]; }).map(function (c) { return { kind: c.kind, min: q(c.min), km: q(c.km), kcal: q(c.kcal), w: q(c.w) }; });
    if (!d.editId && !hasDoc(buildDoc(d))) d.date = todayStr();
  } catch (e) { return newDraft(); }
  return d;
}
var draft = (function () {
  var d = null;
  try { d = JSON.parse(lsGet('gym_draft_v1') || 'null'); } catch (e) { d = null; }
  return cleanDraft(d);
})();
var draftTimer = null;
function flushDraft() {
  clearTimeout(draftTimer); draftTimer = null;
  if (store && store.saveDraft) store.saveDraft(JSON.stringify(draft));
}
function persist() {
  lsSet('gym_draft_v1', JSON.stringify(draft));
  if (store && store.saveDraft) { clearTimeout(draftTimer); draftTimer = setTimeout(flushDraft, 700); }
}
function ensureEx(id) { if (!draft.ex[id]) draft.ex[id] = emptySets(); }

/* ---------- Analiza ---------- */
function setScore(s) {
  var kg = num(s.kg), r = num(s.reps);
  if (!(r > 0)) return 0;
  return kg > 0 ? kg * (1 + r / 30) : r;
}
function maxScore(sets) { var b = 0; (sets || []).forEach(function (s) { var c = setScore(s); if (c > b) b = c; }); return b; }
function sortAsc(a) {
  return a.slice().sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : (x.createdAt || 0) - (y.createdAt || 0); });
}
function analyze() {
  var asc = sortAsc(sessions), best = {}, prs = {};
  asc.forEach(function (s) {
    Object.keys(s.ex || {}).forEach(function (id) {
      var sc = maxScore(s.ex[id]);
      if (!(sc > 0)) return;
      if (best[id] > 0 && sc > best[id] + 1e-9) (prs[s.id] = prs[s.id] || []).push(id);
      if (sc > (best[id] || 0)) best[id] = sc;
    });
  });
  return { asc: asc, prs: prs };
}
function bestOthers(exId, excludeId) {
  var b = 0;
  sessions.forEach(function (s) { if (s.id === excludeId) return; var c = maxScore((s.ex || {})[exId]); if (c > b) b = c; });
  return b;
}
function lastFor(exId, excludeId) {
  var asc = sortAsc(sessions);
  for (var i = asc.length - 1; i >= 0; i--) {
    var s = asc[i];
    if (s.id === excludeId) continue;
    var sets = (s.ex || {})[exId];
    if (sets && sets.length) return { date: s.date, sets: sets };
  }
  return null;
}
function docVolume(d) {
  var v = 0;
  Object.keys(d.ex || {}).forEach(function (id) { d.ex[id].forEach(function (s) { if (s.kg > 0) v += s.kg * s.reps; if (s.drop && s.drop.kg > 0) v += s.drop.kg * s.drop.reps; }); });
  return v;
}
function dropText(dr) {
  if (!dr) return '';
  var k = dr.kg > 0 ? fmt(dr.kg) : '', r = dr.reps > 0 ? fmt(dr.reps, 0) : '';
  if (k && r) return ' + ' + k + '×' + r;
  if (k) return ' + drop ' + k + ' kg';
  return r ? ' + drop ' + r : '';
}
function setsText(sets) {
  var noKg = sets.every(function (s) { return !(num(s.kg) > 0); });
  if (noKg) return sets.map(function (s) { return fmt(s.reps, 0); }).join(' · ') + ' powt.';
  return sets.map(function (s) { return fmt(num(s.kg) > 0 ? s.kg : 0) + '×' + fmt(s.reps, 0) + dropText(s.drop); }).join(' · ');
}

/* ---------- Dokument z szkicu ---------- */
function buildDoc(d) {
  d = d || draft;
  var ex = {}, names = {}, cust = {};
  (d.custom || []).forEach(function (c) { cust[c.id] = c; });
  Object.keys(d.ex).forEach(function (id) {
    if (!cust[id] && EXGROUP[id] !== d.type) return;
    var sets = d.ex[id].map(function (s) {
      var o = { kg: num(s.kg) > 0 ? num(s.kg) : 0, reps: num(s.reps) };
      if (num(s.dreps) > 0 || num(s.dkg) > 0) o.drop = { kg: num(s.dkg) > 0 ? num(s.dkg) : 0, reps: num(s.dreps) > 0 ? num(s.dreps) : 0 };
      return o;
    }).filter(function (s) { return s.reps > 0; });
    if (sets.length) { ex[id] = sets; if (cust[id]) names[id] = cust[id].name; }
  });
  var cardio = d.cardio.map(function (c) {
    var o = { kind: c.kind, min: num(c.min) > 0 ? num(c.min) : 0, km: num(c.km) > 0 ? num(c.km) : 0 };
    var kc = c.kind === 'bieganie' ? runKcal(o.min, o.km) : (num(c.kcal) > 0 ? num(c.kcal) : 0);
    if (kc > 0) o.kcal = kc;
    if (c.kind !== 'bieganie' && num(c.w) > 0) o.watts = num(c.w);
    return o;
  }).filter(function (c) { return c.min > 0 || c.km > 0; });
  var out = { date: d.date, type: d.type, ex: ex, cardio: cardio };
  if (Object.keys(names).length) out.names = names;
  return out;
}
function hasDoc(doc) { return Object.keys(doc.ex).length > 0 || doc.cardio.length > 0; }

/* ---------- Zapis danych ---------- */
function setStatus(mode) {
  var t = { loading: 'Łączenie…', cloud: 'Zapis na koncie, widoczny na każdym urządzeniu', local: 'Zapis tylko na tym urządzeniu',
    slow: 'Brak połączenia z bazą. Dane mogą być nieaktualne.', error: 'Nie można odczytać danych z konta.' }[mode];
  $('#status').textContent = t;
}
function onData() {
  syncNames();
  var a = document.activeElement;
  if (tab === 'trening' && a && a.matches && a.matches('#view input')) return;
  render();
}
function makeLocalStore() {
  var KEY = 'gym_sessions_v1', list = [];
  try { list = JSON.parse(lsGet(KEY) || '[]') || []; } catch (e) { list = []; }
  var emit = function () { lsSet(KEY, JSON.stringify(list)); sessions = list.slice(); onData(); };
  return {
    mode: 'local',
    start: function () {
      try { var st = JSON.parse(lsGet('gym_settings_v1') || 'null'); if (st && st.weight > 0) settings.weight = st.weight; } catch (e) {}
      sessions = list.slice(); onData();
    },
    saveSettings: function (s) { lsSet('gym_settings_v1', JSON.stringify(s)); return Promise.resolve(); },
    save: function (id, doc) {
      id = id || ('s' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
      var rec = Object.assign({}, doc, { id: id });
      var i = list.findIndex(function (x) { return x.id === id; });
      if (i >= 0) list[i] = rec; else list.push(rec);
      emit();
      return Promise.resolve(id);
    },
    remove: function (id) { list = list.filter(function (x) { return x.id !== id; }); emit(); return Promise.resolve(); }
  };
}
async function makeCloudStore() {
  var c = window.claude;
  if (!c || !c.use) return null;
  var res = await Promise.all([c.use('db'), c.use('user'), c.use('downloads'), c.use('sample')]);
  dlApi = res[2] || null;
  photoApi = res[3] || null;
  if (photoApi) { var pa = photoApi; Promise.resolve().then(function () { return pa.limits(); }).then(function (lim) { if (!lim || !lim.images) { photoApi = null; } if (typeof render === 'function') render(); }, function () { photoApi = null; }); }
  if (!res[0] || !res[1]) return null;
  var uid = await res[1].id();
  if (!uid) return null;
  var col = res[0].collection('data/users/' + uid);
  var cloudDraft = null, draftAdopted = false;
  return {
    mode: 'cloud',
    start: function () {
      var timer = setTimeout(function () { setStatus('slow'); }, 10000);
      col.onSnapshot(function (snap) {
        if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus('cloud'); }
        var list = [];
        snap.docs.forEach(function (d) {
          if (d.id === '_draft') { cloudDraft = d.data(); return; }
          if (d.id === '_settings') {
            var w = d.data().weight;
            if (w > 0 && !(document.activeElement && document.activeElement.id === 'f-weight')) settings.weight = w;
          } else list.push(Object.assign({}, d.data(), { id: d.id }));
        });
        sessions = list;
        if (cloudDraft && !draftAdopted && !snap.metadata.fromCache) {
          draftAdopted = true;
          try {
            var cd = cleanDraft(JSON.parse(cloudDraft.json));
            if (!draft.editId && !hasDoc(buildDoc(draft)) && !cd.editId && hasDoc(buildDoc(cd))) { draft = cd; lsSet('gym_draft_v1', JSON.stringify(draft)); }
          } catch (e) {}
        }
        onData();
      }, function () { clearTimeout(timer); setStatus('error'); });
    },
    saveSettings: async function (s) { await col.doc('_settings').set(s); },
    saveDraft: function (json) { try { return col.doc('_draft').set({ json: json, t: Date.now() }).catch(function () {}); } catch (e) {} },
    save: async function (id, doc) { var ref = id ? col.doc(id) : col.doc(); await ref.set(doc); return ref.id; },
    remove: async function (id) { await col.doc(id).delete(); }
  };
}
try { render(); } catch (e) {}
var storeReady = (async function () {
  var s = null;
  try { s = await Promise.race([makeCloudStore(), new Promise(function (r) { setTimeout(function () { r(null); }, 8000); })]); } catch (e) { s = null; }
  store = s || makeLocalStore();
  setStatus(store.mode === 'cloud' ? 'loading' : 'local');
  store.start();
  if (store.mode === 'cloud') setStatus('loading');
  render();
  return store;
})();

/* ---------- Kopia zapasowa i import z pliku ---------- */
function numOr0(z) { var v = Number(z); return isFinite(v) && v > 0 ? v : 0; }
function cleanDoc(o) {
  if (!o || typeof o !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(String(o.date)) || !PLAN[o.type]) return null;
  var names = {}, ex = {}, usedNames = {};
  if (o.names && typeof o.names === 'object') Object.keys(o.names).forEach(function (id) {
    if (/^c_[a-z0-9_]{1,60}$/.test(id) && typeof o.names[id] === 'string' && o.names[id].trim()) names[id] = o.names[id].trim().slice(0, 60);
  });
  Object.keys(o.ex && typeof o.ex === 'object' ? o.ex : {}).forEach(function (id) {
    if (!(EXNAME[id] || names[id]) || !Array.isArray(o.ex[id])) return;
    var arr = o.ex[id].slice(0, 8).map(function (x) {
      var r = numOr0(x && x.reps); if (!r) return null;
      var q = { kg: numOr0(x.kg), reps: r };
      if (x.drop && typeof x.drop === 'object') { var dr = numOr0(x.drop.reps), dk = numOr0(x.drop.kg); if (dr || dk) q.drop = { kg: dk, reps: dr }; }
      return q;
    }).filter(Boolean);
    if (arr.length) { ex[id] = arr; if (names[id] && !EXNAME[id]) usedNames[id] = names[id]; }
  });
  var cardio = (Array.isArray(o.cardio) ? o.cardio : []).filter(function (c) { return c && CNAME[c.kind]; }).map(function (c) {
    var q = { kind: c.kind, min: numOr0(c.min), km: numOr0(c.km) };
    if (numOr0(c.kcal)) q.kcal = numOr0(c.kcal);
    if (numOr0(c.watts)) q.watts = numOr0(c.watts);
    return q;
  }).filter(function (c) { return c.min > 0 || c.km > 0; });
  var doc = { date: String(o.date), type: o.type, ex: ex, cardio: cardio };
  if (Object.keys(usedNames).length) doc.names = usedNames;
  return hasDoc(doc) ? doc : null;
}
function backupText() {

    var o = { date: s.date, type: s.type, ex: s.ex || {}, cardio: s.cardio || [] };

    return o;

function downloadText(filename, text, mime) {
  if (dlApi) {
    return dlApi.save({ filename: filename, data: text }).then(function () { toast('Plik zapisany'); }, function (err) {
      if (err && err.code !== 'declined') toast('Nie udało się zapisać pliku');
    });
  }
  var blob = new Blob([text], { type: mime });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  toast('Plik pobrany');
}
function importText(text) {
  var j;
  try { j = JSON.parse(text); } catch (e) { toast('To nie jest plik z treningami'); return; }
  var arr = Array.isArray(j) ? j : (j && Array.isArray(j.sessions) ? j.sessions : null);
  if (!arr) { toast('To nie jest plik z treningami'); return; }
  var docs = [], bad = 0;
  arr.forEach(function (o) { var d = cleanDoc(o); if (d) docs.push(d); else bad++; });
  var have = {};
  sessions.forEach(function (x) { have[x.date + '|' + x.type] = 1; });
  var todo = docs.filter(function (d) { var k = d.date + '|' + d.type; if (have[k]) return false; have[k] = 1; return true; });
  var skipped = docs.length - todo.length;
  if (!todo.length) { toast(docs.length ? 'Wszystkie treningi z pliku już są w historii' : 'W pliku nie ma treningów'); return; }
  storeReady.then(function (st) {
    return todo.reduce(function (pr, d, i) {
      return pr.then(function () { return st.save(null, Object.assign({}, d, { createdAt: Date.now() + i })); });
    }, Promise.resolve());
  }).then(function () {
    toast('Wczytano ' + todo.length + (skipped || bad ? ', pominięto ' + (skipped + bad) : '')); render();
  }, function () { toast('Nie udało się wczytać. Spróbuj jeszcze raz.'); render(); });
}

    if (last) {
      ensureEx(d.fill);
      var cnt = EXGROUP[d.fill] === 'custom' ? Math.max(SETS, Math.min(last.sets.length, 8)) : SETS;
      draft.ex[d.fill] = [];
      for (var i = 0; i < cnt; i++) draft.ex[d.fill][i] = last.sets[i] ? docSetToDraft(last.sets[i]) : emptySet();
      persist(); renderTrening(); updateFoot();
    }
    return;
  }
  if (d.act === 'cancel-edit') { draft = newDraft(draft.type); persist(); render(); return; }
  if (d.act === 'json') { downloadText('treningi-kopia-' + todayStr() + '.json', backupText(), 'application/json'); return; }
  if (d.act === 'csv') {
    if (dlApi) {
      dlApi.save({ filename: 'trening-' + todayStr() + '.csv', data: csvText() }).then(function () { toast('Plik zapisany'); }, function (err) {
        if (err && err.code !== 'declined') toast('Nie udało się zapisać pliku');
      });
    } else {
      var blob = new Blob([csvText()], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'trening-' + todayStr() + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('Plik pobrany');
    }
    return;
  }
  if (d.edit) {
    var s = sessions.filter(function (x) { return x.id === d.edit; })[0]; if (!s) return;
    var nd = newDraft(s.type); nd.date = s.date; nd.editId = s.id;
    Object.keys(s.ex || {}).forEach(function (id) {
      if (!EXNAME[id]) return;
      var isCust = EXGROUP[id] === 'custom';
      if (isCust) nd.custom.push({ id: id, name: EXNAME[id], noKg: false });
      var arr = s.ex[id].slice(0, isCust ? 8 : SETS).map(docSetToDraft);
      while (arr.length < SETS) arr.push(emptySet());
      nd.ex[id] = arr;
      PLAN[s.type].slots.forEach(function (sl) { if (sl.variants.some(function (v) { return v.id === id; })) nd.variant[sl.id] = id; });
    });
    nd.cardio = (s.cardio || []).map(function (c) { return { kind: c.kind, min: c.min > 0 ? String(c.min).replace('.', ',') : '', km: c.km > 0 ? String(c.km).replace('.', ',') : '', kcal: c.kind !== 'bieganie' ? fnum(c.kcal) : '', w: fnum(c.watts) }; });
    draft = nd; persist(); goTab('trening'); return;
  }
  if (d.del) {
    if (pendingDelete !== d.del) {
      pendingDelete = d.del; clearTimeout(pendingTimer);
      pendingTimer = setTimeout(function () { pendingDelete = null; if (tab === 'historia') render(); }, 4000);
      render(); return;
    }
    clearTimeout(pendingTimer); pendingDelete = null;
    storeReady.then(function (st) { return st.remove(d.del); }).then(function () { toast('Usunięto'); render(); }, function () { toast('Nie udało się usunąć'); });
    return;
  }
  if (d.pt !== undefined) { chartSel.idx = +d.pt; renderWykresy(); return; }
  if (d.metric) { chartSel.metric = d.metric; chartSel.idx = null; renderWykresy(); return; }
  if (d.step) {
    var pts = series(chartSel.ex, chartSel.metric), cur = (chartSel.idx === null || chartSel.idx >= pts.length) ? pts.length - 1 : chartSel.idx;
    chartSel.idx = Math.max(0, Math.min(pts.length - 1, cur + +d.step)); renderWykresy(); return;
  }
  if (el.id === 'save') {
    var doc = buildDoc(); if (!hasDoc(doc)) return;
    el.disabled = true;
    var existing = draft.editId ? sessions.filter(function (x) { return x.id === draft.editId; })[0] : null;
    doc.createdAt = existing && existing.createdAt ? existing.createdAt : Date.now();
    var wasEdit = !!draft.editId, type = doc.type;
    storeReady.then(function (st) { return st.save(draft.editId, doc); }).then(function () {
      draft = newDraft(type); persist(); toast(wasEdit ? 'Zmiany zapisane' : 'Trening zapisany'); goTab('historia');
    }, function () { toast('Nie udało się zapisać. Spróbuj jeszcze raz.'); updateFoot(); });
  }
});

document.addEventListener('visibilitychange', function () { if (document.hidden) flushDraft(); });
window.addEventListener('pagehide', flushDraft);

render();
})();
</script>

<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
